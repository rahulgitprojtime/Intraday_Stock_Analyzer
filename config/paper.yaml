# Paper trading / backtesting (M10 DECISIONS #20, simulated broker #29).
# SIMULATION ONLY: orders go to an in-process simulated broker; no order
# ever reaches Groww (no live broker exists). Off by default. These are
# starting values to be *evaluated*, not optimised.

enabled: false                # live paper session in the worker (also: worker --paper;
                              # scripts/live_day.ps1 passes --paper since 2026-10-09, DECISIONS #30)
strategy: recommendation      # single strategy (used when `strategies` is absent)
# Strategies run side by side, each its own broker + ledger run
# (`paper:<day>:<name>`, resumed after a worker restart, DECISIONS #30).
# Live since 2026-10-09 (DECISIONS #31): scalp (1-min price action) and
# trend (5-min setups + indicator confirmation). Both trade only with the
# market sentiment (BULLISH → long, BEARISH → short, NEUTRAL → no new
# trades) and only on a clear setup; there is no minimum number of trades.
# recommendation and orb remain available for backtests.
strategies: [scalp, trend]
report_dir: reports           # reports/paper_<day>.md written when the worker stops
mode: DAY                     # which recommendation list feeds entries (SCALP | DAY)
quantity: 10                  # recommendation strategy: fixed shares per trade

ledger: data/paper/paper.sqlite              # live paper runs (one run per day)
backtest_ledger: data/paper/backtests.sqlite # scripts/backtest.py and paper_replay.py

broker:                       # simulated broker, shared by backtest and paper mode
  starting_capital: 100000    # rupees; cash is debited by fills and charges
  max_position_value: 49000   # per symbol, at placement price; 2 x 49k shorts fit the
                              # 2x-notional short margin on 1 lakh (DECISIONS #33)
  max_open_positions: 2       # held + pending-entry symbols (#33: fewer, larger trades)
  # Signal at the close of minute T -> market fill at the next bar's open
  # (backtest) or the next live tick (paper). A bar touching both stop and
  # target counts as the stop. A gap through the stop fills at the open.
  slippage_bps: 5             # against us on market and stop fills
  square_off: "15:15"         # close everything at the last price; no entries after
  exchange: NSE               # cost model rates (config/costs.yaml)
  allow_short: true           # DECISIONS #30: intraday (MIS) shorts; full notional blocked as margin

entry:                        # recommendation strategy entry policy
  minimum_category: CANDIDATE # STRONG_CANDIDATE > CANDIDATE > WATCH > NEUTRAL
  minimum_score: 65
  require_triggered_setup: true
  require_in_play: false
  max_rank: 10                # only the top-N list
  max_open_positions: 3
  max_trades_per_symbol_per_day: 1
  no_entry_after: "15:00"

risk:                         # recommendation strategy exits, fixed at entry, never moved
  stop_atr_mult: 0.25         # stop = fill - 0.25 x daily ATR (prior sessions only)
  stop_fallback_pct: 0.6      # when daily ATR is unavailable
  target_r: 1.5               # target = fill + 1.5 x initial risk

orb:                          # sample Opening Range Breakout (src/paper/strategies/orb.py)
  range_minutes: 15
  target_r: 2.0
  risk_per_trade: 500         # rupees lost at the stop (before costs/slippage)
  max_position_value: 25000
  max_range_pct: 3.0          # skip days whose opening range is wider
  last_entry: "14:30"
  allow_short: true           # DECISIONS #30: close below the range low -> short, stop ~range high

scalp:                        # src/paper/strategies/scalp.py — price action only, 1-min
  consolidation_bars: 6       # TIGHT_BREAKOUT: bars in the base
  tight_mult: 2.5             # base range <= this x average bar range
  body_min: 0.6               # signal bar body share of its range
  close_zone: 0.3             # close within the top 30% of the bar
  expansion_min: 1.2          # signal bar range >= this x average
  range_lookback: 20          # bars for the average range
  swing_lookback: 20          # new local high / swing structure window
  min_bars: 10                # bars of today before any signal
  stop_buffer: 0.1            # x average range beyond the structure
  max_risk_mult: 4.0          # skip when the stop is wider than this x average range
  target_r: 2.0               # #33: 2R minimum (was 1.5)
  max_hold_minutes: 15        # scalps: time exit if neither stop nor target
  risk_per_trade: 1000        # rupees at the stop (before costs/slippage)
  max_position_value: 49000
  max_trades_per_symbol: 1
  max_trades_per_day: 20      # #33: 113 scalps a day was churn
  # shared entry/exit rules (DECISIONS #33), starting values, unvalidated
  stop_atr_mult: 1.0          # stop >= 1 x ATR(14) of 1-min bars (noise floor)
  min_stop_pct: 0.15          # stop >= 0.15% of the entry price
  rs_filter: true             # long beats NIFTY / short lags it, since prev close
  structure_filter: true      # no short on higher lows / long on lower highs
  min_reward_cost_mult: 3     # skip when target profit < 3 x round-trip charges
  first_entry: "09:25"
  last_entry: "15:00"

trend:                        # src/paper/strategies/trend.py — trades > 10-15 min
  timeframe: 5                # setups on 5-min bars
  setups: [ORB15, VWAP_RECLAIM, VWAP_PULLBACK, EMA_PULLBACK, PDH]
  adx_min: 20                 # confirmations on 1-min bars: VWAP, EMA9>EMA20,
  rsi_range: [50, 75]         # ADX, RSI, Supertrend (all required)
  stop_mult: 1.0              # x average true range of today's 5-min bars
  min_5m_bars: 3
  ext_mult: 1.0
  target_r: 2.0
  risk_per_trade: 1000
  max_position_value: 49000
  max_trades_per_symbol: 2
  max_hold_minutes: 120       # #33: time stop (was none)
  stall_minutes: 30           # #33: exit when not +0.5R after 30 min, freeing the slot
  stall_r: 0.5
  # shared entry/exit rules (DECISIONS #33), starting values, unvalidated
  stop_atr_mult: 1.0          # stop >= 1 x ATR(14) of 1-min bars (noise floor)
  min_stop_pct: 0.15          # stop >= 0.15% of the entry price
  rs_filter: true             # long beats NIFTY / short lags it, since prev close
  structure_filter: true      # no short on higher lows / long on lower highs
  min_reward_cost_mult: 3     # skip when target profit < 3 x round-trip charges
  first_entry: "09:30"
  last_entry: "14:30"
