# Application-wide settings. Overridable via environment variables where noted.

# No trading modes and no order execution: orders exist only in the paper
# simulator (DECISIONS #8).

storage:
  data_dir: ./data
  instrument_cache_file: cache/groww_instruments.csv
  instrument_cache_max_age_hours: 20

feed:                               # live feed watchdog (DECISIONS #17)
  poll_seconds: 1.0                 # poller reads latest LTP/depth values
  stale_after_seconds: 30           # no tick for this long -> STALE
  down_after_seconds: 60            # -> DOWN and restart
  min_restart_interval_seconds: 60
  max_fast_restarts: 5              # then back off
  slow_restart_interval_seconds: 300
  min_stock_coverage: 0.5           # share of stocks ticking within down_after

candles:
  timeframes_minutes: [1, 3, 5, 15]
  stale_after_seconds: 120          # 1-min candle freshness for scoring (M6)

