# Application-wide settings. Overridable via environment variables where noted.

# Recommendation-only product: no trading modes, no order execution
# (DECISIONS.md #8).

logging:
  level: INFO

storage:
  data_dir: ./data
  historical_cache_format: parquet   # parquet | duckdb
  instrument_cache_file: cache/groww_instruments.csv
  instrument_cache_max_age_hours: 20

feed:
  reconnect_max_retries: 10
  reconnect_backoff_seconds: 2       # exponential backoff base
  stale_data_threshold_seconds: 15   # flag a symbol's data as stale after this

candles:
  timeframes_minutes: [1, 3, 5, 15]

