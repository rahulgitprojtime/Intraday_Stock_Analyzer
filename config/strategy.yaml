# Scoring weights and signal thresholds. All illustrative defaults —
# not tuned/optimized. See DECISIONS.md and Phase 11 of the spec: never
# optimize weights on the full historical dataset.

# Sub-weights inside the quantitative score (sum to 100).
scoring:
  weights:
    trend: 25
    momentum: 20
    volume: 20
    vwap: 15
    market_context: 10
    liquidity: 10
  # Weights should sum to 100; validated at load time in src/utils (M6+).

# Final Recommendation Score (0-100) blend. Starting defaults, not tuned.
# Must sum to 1.0. The score is NOT a probability of profit.
recommendation:
  weights:
    quantitative: 0.60
    qualitative: 0.20
    market_context: 0.10
    sector_context: 0.05
    liquidity: 0.05
  categories:              # min score for each analytical category
    STRONG_CANDIDATE: 80
    CANDIDATE: 65
    WATCH: 50
    NEUTRAL: 35            # below this -> AVOID
  avoid_max_liquidity_score: 20   # below this, AVOID regardless of score

indicators:
  ema_periods: [9, 20, 50]
  rsi_period: 14
  atr_period: 14
  adx_period: 14
  bollinger_period: 20
  bollinger_std: 2.0

rvol:
  method: time_of_day_adjusted     # time_of_day_adjusted | simple_ratio
  lookback_days: 20

regime:
  volatility_lookback_days: 20

# Stocks-in-play scanner (M5). Each feature maps linearly to 0-100 between
# its ramp bounds, then blends by weight (sum 100). Not tuned.
in_play:
  weights:
    rvol: 35
    gap: 15
    atr_pct: 15
    range_expansion: 15
    rs: 20
  ramps:
    rvol: [1.0, 3.0]
    gap: [0.0, 3.0]
    atr_pct: [1.0, 4.0]
    range_expansion: [0.3, 1.0]
    rs: [0.0, 2.0]
  min_score: 50
  min_rvol: 1.5
