# Scoring weights and signal thresholds. All illustrative defaults —
# not tuned/optimized. See DECISIONS.md and Phase 11 of the spec: never
# optimize weights on the full historical dataset.

# M6 baseline quantitative scoring model (DECISIONS #14). Temporary
# engineering defaults, NOT claimed optimal; M10 validates. Weights exist
# only for components that are implemented; future components (sector M8,
# qualitative M9) get weights when they ship. Unavailable components are
# excluded from the blend, never defaulted.
engine:
  weights:                 # positive, must sum to 1.0
    setup: 0.55
    in_play: 0.35
    market_context: 0.10
  state_points: {TRIGGERED: 100, FORMING: 60, EXTENDED: 30, FAILED: 0, NONE: 0}
  # Confluence: additive bonus by number of independent setup families
  # TRIGGERED/FORMING (price_structure, vwap, trend, momentum,
  # relative_strength). Correlated setups in one family count once.
  confluence_bonus: {2: 2, 3: 3, 4: 5}
  confluence_max_bonus: 5
  market_ramp_pct: [-0.5, 0.5]   # NIFTY % since open -> 0..100
  ext_atr_mult: {SCALP: 0.15, DAY: 0.30}
  ext_fallback_pct: 0.5    # when daily ATR is unavailable
  time_rules:              # initial time-of-day heuristics, unvalidated
    opening_cap_until: "09:20"   # cap at WATCH before this
    lunch_start: "11:30"
    lunch_end: "13:30"
    lunch_penalty: 10
    day_cap_after: "14:45"       # DAY mode capped at WATCH
    close_cap_after: "15:00"     # all modes capped at NEUTRAL

# Analytical categories (min score). The score ranks candidates; it is NOT
# a probability of profit.
recommendation:
  categories:
    STRONG_CANDIDATE: 80
    CANDIDATE: 65
    WATCH: 50
    NEUTRAL: 35            # below this -> AVOID

indicators:
  ema_periods: [9, 20, 50]
  rsi_period: 14
  atr_period: 14
  adx_period: 14
  bollinger_period: 20
  bollinger_std: 2.0

rvol:
  method: time_of_day_adjusted     # time_of_day_adjusted | simple_ratio
  lookback_days: 20

regime:
  volatility_lookback_days: 20

# Live-feed microstructure (M7, SCALP only). Imbalance = (bid qty - ask
# qty) / total over the depth payload; velocity = ticks in the last
# minute / 5-min average. Linear ramps to 0-100, blended by weight (sum 1).
# Illustrative defaults, unvalidated (M10).
microstructure:
  weights:
    imbalance: 0.6
    velocity: 0.4
  ramps:
    imbalance: [0.0, 0.4]
    velocity: [1.0, 2.5]

# Stocks-in-play scanner (M5). Each feature maps linearly to 0-100 between
# its ramp bounds, then blends by weight (sum 100). Not tuned.
in_play:
  weights:
    rvol: 35
    gap: 15
    atr_pct: 15
    range_expansion: 15
    rs: 20
  ramps:
    rvol: [1.0, 3.0]
    gap: [0.0, 3.0]
    atr_pct: [1.0, 4.0]
    range_expansion: [0.3, 1.0]
    rs: [0.0, 2.0]
  min_score: 50
  min_rvol: 1.5
