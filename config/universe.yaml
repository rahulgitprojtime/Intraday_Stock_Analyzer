# Stock universe and liquidity filters. NSE CASH equities only
# (DECISIONS.md #6). Symbols are resolved against the Groww instrument
# master (src/broker/groww_instruments.py); unresolvable symbols are
# reported, never silently dropped.

exchange: NSE
allowed_series: [EQ]     # excludes BE/SM/ST etc. (trade-to-trade, SME)
require_intraday: true   # reject stocks with is_intraday=0 (MIS not allowed)

# Starter watchlist of widely traded large caps — NOT an index
# constituent list. Liquidity filters (M6) decide final eligibility.
symbols:
  - RELIANCE
  - HDFCBANK
  - ICICIBANK
  - INFY
  - TCS
  - SBIN
  - AXISBANK
  - KOTAKBANK
  - LT
  - ITC
  - BHARTIARTL
  - HINDUNILVR
  - BAJFINANCE
  - MARUTI
  - M&M
  - SUNPHARMA
  - TATASTEEL
  - HCLTECH
  - WIPRO
  - NTPC
  - POWERGRID
  - ONGC
  - ADANIENT
  - ULTRACEMCO
  - TITAN

# Market/sector context (M7). Verified present as instrument_type=IDX.
indices:
  - NIFTY
  - BANKNIFTY
  - NIFTYIT
  - NIFTYAUTO
  - NIFTYFMCG
  - NIFTYMETAL
  - NIFTYPHARMA
  - NIFTYREALTY
  - INDIAVIX

filters:
  min_price: 250.0                   # price band 250..2500 (user, 2026-09-28)
  max_price: 2500.0
  min_avg_daily_volume: 500000
  min_avg_traded_value: 50000000     # in rupees
  max_spread_pct: 0.5
  max_universe_size: 200

# Market-wide volume scan (DECISIONS #21, #23, #31). Each minute the live
# worker follows EVERY stock that qualifies — there is no top-N:
#   1. market sentiment from NIFTY + BANK NIFTY (`sentiment`) picks the side:
#      BULLISH → rising stocks, BEARISH → falling stocks, NEUTRAL → both
#      (shown on the dashboard; the paper strategies take no new trades);
#   2. a stock qualifies when it moved `qualify.min_move_pct` that way vs the
#      previous close, beats (long) / lags (short) NIFTY, and trades
#      `qualify.min_volume_change` x its normal volume for the time of day,
#      inside `filters` (price band, liquidity);
#   3. the only ceiling is the Groww API budget: each followed stock costs a
#      quote + a 1-min candle refresh per minute, so at most
#      (api_calls_per_minute − batch and index calls) / 2 stocks.
# `symbols` above is used only when scan is disabled and by replays.
scan:
  enabled: true
  api_calls_per_minute: 280  # Groww Live Data cap is 300/min; 20 kept as headroom
  min_stay_minutes: 10       # a stock stays at least this long once it enters
  qualify:
    min_move_pct: 0.5        # |change vs previous close| in the market's direction
    min_volume_change: 1.5   # volume vs normal for the time of day
    require_rs_vs_nifty: true
  sentiment:                 # src/market/sentiment.py
    dead_band_pct: 0.1       # index moves smaller than this vote 0
    trend_minutes: 15        # trend vote: last vs this many minutes ago
    min_index_score: 1       # both indices must lean the same way...
    min_total_score: 3       # ...with this combined score (of ±6)
  stats_sessions: 20
  prep_calls_per_minute: 150 # morning daily-stats pacing (200 back-to-back measured OK)
  quote_workers: 4
  max_calls_per_second: 8    # shared limiter; Groww Live Data limit is 10/s
  quote_max_age_seconds: 180 # older quotes stop counting
  # Historical research replays only (worker --replay --scan-universe):
  # reproduce the pre-registered top-50 up-mover selection (DECISIONS #26).
  replay_top_n: 50
  long_only: true
  calls_per_minute: 200      # replay sweep pacing
