# Stock universe and liquidity filters. NSE CASH equities only
# (DECISIONS.md #6). Symbols are resolved against the Groww instrument
# master (src/broker/groww_instruments.py); unresolvable symbols are
# reported, never silently dropped.

exchange: NSE
allowed_series: [EQ]     # excludes BE/SM/ST etc. (trade-to-trade, SME)
require_intraday: true   # reject stocks with is_intraday=0 (MIS not allowed)

# Starter watchlist of widely traded large caps — NOT an index
# constituent list. Liquidity filters (M6) decide final eligibility.
symbols:
  - RELIANCE
  - HDFCBANK
  - ICICIBANK
  - INFY
  - TCS
  - SBIN
  - AXISBANK
  - KOTAKBANK
  - LT
  - ITC
  - BHARTIARTL
  - HINDUNILVR
  - BAJFINANCE
  - MARUTI
  - M&M
  - SUNPHARMA
  - TATASTEEL
  - HCLTECH
  - WIPRO
  - NTPC
  - POWERGRID
  - ONGC
  - ADANIENT
  - ULTRACEMCO
  - TITAN

# Market/sector context (M7). Verified present as instrument_type=IDX.
indices:
  - NIFTY
  - BANKNIFTY
  - NIFTYIT
  - NIFTYAUTO
  - NIFTYFMCG
  - NIFTYMETAL
  - NIFTYPHARMA
  - NIFTYREALTY
  - INDIAVIX

filters:
  min_price: 250.0                   # price band 250..2500 (user, 2026-09-28)
  max_price: 2500.0
  min_avg_daily_volume: 500000
  min_avg_traded_value: 50000000     # in rupees
  max_spread_pct: 0.5
  max_universe_size: 200

# Market-wide volume scan (M11, DECISIONS #21). When enabled, the live
# worker's universe is the top_n stocks by volume change (today's volume
# vs 20-day average, adjusted for time of day) among all NSE EQ-series,
# intraday-allowed stocks that pass `filters` and trade above the previous
# close (long-only). `symbols` above is used only when scan is disabled
# and by replays.
scan:
  enabled: true
  top_n: 50                  # pre-ranked by quote-computable groups; full 8-group score on these (M12)
  min_stay_minutes: 10       # a stock stays at least this long once it enters
  calls_per_minute: 200      # quote budget (Groww Live Data limit is 300/min total)
  stats_sessions: 20
  prep_calls_per_minute: 150 # morning daily-stats pacing (200 back-to-back measured OK)
  long_only: true            # the LONG universe (top_n) stays up-movers only
  # DECISIONS #30 short side (paper ORB shorts): the top `short_top_n`
  # down-movers (below the previous close, mirrored movement score) are
  # added to the universe after the longs; `short_movers_per_cycle` of them
  # are quoted each minute. Research snapshots exclude short-only names.
  short_top_n: 15
  short_movers_per_cycle: 30
  # M13 fast cycle (DECISIONS #23), once a minute: batch OHLC + LTP for the
  # whole pool (50 per call; feed prices used where subscribed), movement
  # pre-rank, then parallel quotes (volume, VWAP) for the top movers only.
  movers_per_cycle: 100
  quote_workers: 4
  max_calls_per_second: 8    # shared limiter; Groww Live Data limit is 10/s
  quote_max_age_seconds: 180 # older quotes stop counting in the ranking
